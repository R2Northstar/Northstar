name: CI
on: [push, pull_request]

jobs:
  # Ensure correct Rust code formatting
  formatting:
    name: format-check
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Format check
        run: cargo fmt --all -- --check

  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Nix
        uses: nixbuild/nix-quick-install-action@v34
        with:
          # We don't enable ca-derivations here
          # because we have later jobs where ca-derivations is enabled.
          nix_conf: ${{ env.nix_conf }}

      - name: Restore and save Nix store
        uses: nix-community/cache-nix-action@v6
        with:
          # restore and save a cache using this key
          primary-key: nix-${{ runner.os }}-${{ hashFiles('**/*.nix', '**/flake.lock') }}
          # if there's no cache hit, restore a cache by this prefix
          restore-prefixes-first-match: nix-${{ runner.os }}-
          # collect garbage until the Nix store size (in bytes) is at most this number
          # before trying to save a new cache
          # 1G = 1073741824
          gc-max-store-size-linux: 2G
          # do purge caches
          purge: false
          # purge all versions of the cache
          purge-prefixes: nix-${{ runner.os }}-
          # created more than this number of seconds ago
          purge-created: 0
          # or, last accessed more than this number of seconds ago
          # relative to the start of the `Post Restore and save Nix store` phase
          purge-last-accessed: 604800
          # except any version with the key that is the same as the `primary-key`
          purge-primary-key: never

      - name: Build
        run: nix build

      - name: Cache this Build
        continue-on-error: true
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        run: |
          nix run nixpkgs#attic-client -- login northstar https://attic.catornot.net ${{ secrets.ATTIC_CACHE_TOKEN }}
          nix run nixpkgs#attic-client -- push northstar ./result
